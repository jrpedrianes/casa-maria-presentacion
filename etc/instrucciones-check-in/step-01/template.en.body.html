<p><strong>Access to the property</strong></p>

<p>The property gate will be <strong>closed but unlocked</strong> — simply open it and drive in.</p>

<p>
  Once inside, you can <strong>park on the property</strong>. The parking area is on the right, next
  to the house.
</p>

<p>
  After parking, go to the house entrance. There you will find the <strong>key lockbox</strong> to
  access the interior.
</p>

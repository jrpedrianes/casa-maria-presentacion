<p>Antes de irte, aseg&uacute;rate de:</p>

<ul>
  <li><strong>Cerrar bien la puerta de la casa</strong> con llave.</li>
  <li>Dejar la llave de nuevo en la <strong>caja de llaves</strong>, en la entrada de la casa.</li>
  <li>
    Revolver la rueda del cajet&iacute;n despu&eacute;s de guardar la llave, para
    <strong>no dejar el c&oacute;digo marcado</strong>.
  </li>
</ul>
